services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/billingsoft
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
volumes:
  mongo-data:
